# Local development — databases only (run app with npm run dev).
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: ulfborg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ulfborg
      POSTGRES_PASSWORD: ulfborg_dev
      POSTGRES_DB: ulfborg
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulfborg -d ulfborg"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ulfborg-redis
    restart: unless-stopped
    ports:
      - "6391:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
